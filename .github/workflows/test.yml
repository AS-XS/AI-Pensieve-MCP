name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: python -m archive_mcp.demo > demo.json
      - run: python -c "import json; r=json.load(open('demo.json')); assert r['ok'] and r['check']['ok'] and r['mcp']['ok']"
      - name: Evaluate synthetic retrieval
        run: python -m archive_mcp.evaluate > evaluation.json
      - name: Check retrieval baseline
        # Case 9 is the documented offline/disconnected synonym miss.
        # It may improve, but every other case must retain full recall.
        run: >-
          python -c "import json;
          r=json.load(open('evaluation.json'));
          print(json.dumps(r, indent=2));
          assert r['top_k'] == 5 and r['case_count'] == 11;
          assert {c['case'] for c in r['cases']} == set(range(1, 12));
          assert all(c['passed'] and (c['recall'] is None or c['recall'] == 1.0) for c in r['cases'] if c['case'] != 9)"
      - name: Build and validate distributions
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build --outdir dist/core
          python -m build packaging/desktop --outdir dist/desktop
          python -m twine check --strict dist/core/* dist/desktop/*
      - name: Check installed package commands and MCP
        env:
          # Source egg-info must not make pip skip installing the built wheel.
          PYTHONPATH: ""
        run: |
          python -m pip install --no-deps --no-index --find-links dist/core --find-links dist/desktop ai-pensieve-mcp ai-pensieve
          python -I scripts/check_installed.py
