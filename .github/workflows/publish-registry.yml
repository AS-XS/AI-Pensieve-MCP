name: Publish MCP Registry metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install jsonschema==4.26.0
      - name: Validate metadata and published PyPI ownership
        run: python scripts/check_registry.py
      - name: Download official publisher
        run: |
          curl --fail --location --silent --show-error https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz -o "$RUNNER_TEMP/mcp-publisher.tar.gz"
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
      - name: Authenticate with GitHub identity
        run: '"$RUNNER_TEMP/mcp-publisher" login github-oidc'
      - name: Publish metadata
        run: '"$RUNNER_TEMP/mcp-publisher" publish server.json'
