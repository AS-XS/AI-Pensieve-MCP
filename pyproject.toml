[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pensieve-mcp"
version = "0.1.0"
description = "A local archive of AI conversations with read-only MCP retrieval"
readme = "docs/PYPI_README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]
dependencies = ["mcp==2.1.1"]

[project.optional-dependencies]
gui = ["pywebview==6.2.1"]

[project.scripts]
ai-pensieve-mcp = "archive_mcp.mcp_server:main"
pensieve-archive = "archive_mcp.cli:main"

[project.urls]
Repository = "https://github.com/AS-XS/AI-Pensieve-MCP"
Documentation = "https://github.com/AS-XS/AI-Pensieve-MCP#readme"
Issues = "https://github.com/AS-XS/AI-Pensieve-MCP/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
archive_mcp = ["gui_assets/*.html", "gui_assets/*.css", "gui_assets/*.js", "gui_assets/*.png", "gui_assets/logos/*.svg", "gui_assets/logos/LICENSE.txt"]
