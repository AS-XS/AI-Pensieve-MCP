[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pensieve-mcp"
version = "0.1.0"
description = "A local archive of AI conversations with read-only MCP retrieval"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["mcp==2.1.1"]

[project.optional-dependencies]
gui = ["pywebview==6.2.1"]

[project.scripts]
pensieve = "archive_mcp.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
archive_mcp = ["gui_assets/*.html", "gui_assets/*.css", "gui_assets/*.js", "gui_assets/*.png", "gui_assets/logos/*.svg", "gui_assets/logos/LICENSE.txt"]
